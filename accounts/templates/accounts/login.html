{% extends "accounts/base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">ورود به سایت</h1>
        <form method="post">
          {% csrf_token %}
          {% include "accounts/_form_fields.html" %}
          {# پارامتر next: بعد از ورود، کاربر به همین آدرس برمی‌گردد #}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">ورود</button>
        </form>
        <p class="mt-3 mb-0 small">حساب ندارید؟ <a href="{% url 'signup' %}">ثبت‌نام کنید</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
