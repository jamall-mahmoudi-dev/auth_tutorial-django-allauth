{% extends "accounts/base.html" %}
{% block title %}کوییز{% endblock %}
{% block content %}
<h1 class="h4 mb-3">کوییز احراز هویت</h1>
<form method="post">
  {% csrf_token %}
  {% for q in questions %}
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="h6">{{ forloop.counter }}. {{ q.text }}</h2>
        {% for option in q.options %}
          <div class="form-check">
            <input class="form-check-input" type="radio" name="{{ q.id }}"
                   id="{{ q.id }}_{{ forloop.counter0 }}" value="{{ forloop.counter0 }}">
            <label class="form-check-label" for="{{ q.id }}_{{ forloop.counter0 }}">{{ option }}</label>
          </div>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">ثبت پاسخ‌ها</button>
</form>
{% endblock %}
