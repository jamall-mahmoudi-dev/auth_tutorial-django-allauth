{% extends "accounts/base.html" %}
{% block title %}ثبت‌نام{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">ثبت‌نام</h1>
        <form method="post">
          {% csrf_token %}
          {% include "accounts/_form_fields.html" %}
          <button type="submit" class="btn btn-success w-100">ساخت حساب کاربری</button>
        </form>
        <p class="mt-3 mb-0 small">قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'login' %}">وارد شوید</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
